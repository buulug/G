<!DOCTYPE html>
<html lang="ru" class="dark select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Brawl IO - Skin Customization Mobile Arena</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        display: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }

        body {
            background: #030712;
            color: #f8fafc;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Мобильные Кнопки Управления (Джойстик слева, Атака и Рывок справа) */
        #joystickZone {
            position: absolute;
            bottom: 25px;
            left: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            pointer-events: auto;
        }

        #joystickStick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin-top: -25px;
            margin-left: -25px;
            border-radius: 50%;
            background: radial-gradient(circle, #38bdf8 0%, #0284c7 100%);
            box-shadow: 0 0 15px #0284c7;
            transition: transform 0.04s linear;
        }

        /* Правая зона действий (Атака + Рывок) */
        .action-controls-right {
            position: absolute;
            bottom: 25px;
            right: 20px;
            display: flex;
            align-items: flex-end;
            gap: 16px;
            pointer-events: auto;
        }

        .toast-slide {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .drawer-slide {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .drawer-closed {
            transform: translateX(115%);
        }

        /* Скрыть скроллбар в меню скинов */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="relative flex items-center justify-center font-sans antialiased">

    <!-- Тост-уведомление -->
    <div id="toast" class="toast-slide fixed top-4 z-[100] -translate-y-20 opacity-0 bg-cyan-500 text-slate-950 px-4 py-2.5 rounded-2xl font-bold text-xs shadow-xl flex items-center gap-2 border border-cyan-300">
        <i class="fa-solid fa-circle-check text-sm"></i>
        <span id="toastText">Код скопирован!</span>
    </div>

    <!-- Модальное окно настройки собственного Firebase -->
    <div id="configModal" class="hidden fixed inset-0 z-[60] glass bg-slate-950/80 flex items-center justify-center p-4">
        <div class="glass max-w-sm w-full rounded-3xl p-5 border border-cyan-500/30 space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-display text-sm font-bold text-cyan-400"><i class="fa-solid fa-gear mr-1"></i> Настройки Firebase</h3>
                <button onclick="toggleConfigModal()" class="text-slate-400 text-sm hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-[10px] text-slate-300">Вставьте свой Firebase Config (JSON), чтобы создать приватный изолированный сервер для себя и друзей:</p>
            <textarea id="firebaseConfigInput" rows="5" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "..."}' 
                      class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-[11px] font-mono text-cyan-300 focus:outline-none focus:border-cyan-500"></textarea>
            <div class="flex gap-2">
                <button onclick="saveCustomFirebaseConfig()" class="flex-1 py-2 bg-cyan-500 text-slate-950 font-bold text-xs rounded-xl hover:bg-cyan-400 transition">
                    Сохранить
                </button>
                <button onclick="resetFirebaseConfig()" class="py-2 px-3 bg-slate-800 text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-700 transition">
                    Сброс
                </button>
            </div>
        </div>
    </div>

    <!-- Главное Меню с Выбором Скинов (Lobby) -->
    <div id="authScreen" class="absolute inset-0 z-50 flex items-center justify-center p-3 bg-gradient-to-br from-slate-950 via-slate-900 to-cyan-950 overflow-y-auto">
        <div class="glass max-w-md w-full rounded-3xl p-5 shadow-2xl space-y-4 text-center border border-cyan-500/30 my-auto relative">
            
            <button onclick="toggleConfigModal()" class="absolute top-4 right-4 text-slate-400 hover:text-cyan-400 text-sm p-1 transition" title="Настройки сервера">
                <i class="fa-solid fa-gear"></i>
            </button>

            <div>
                <h1 class="font-display text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-teal-300 to-pink-500">
                    NEON BRAWL
                </h1>
                <p class="text-[11px] text-slate-400 mt-0.5">Онлайн Мультиплеер с Друзьями</p>
            </div>

            <!-- Имя пользователя -->
            <div class="text-left space-y-1">
                <label class="block text-[10px] font-extrabold text-cyan-400 uppercase tracking-widest">Никнейм</label>
                <input type="text" id="nicknameInput" maxlength="10" value="Brawler" 
                       class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm font-semibold focus:outline-none focus:border-cyan-500 text-slate-100">
            </div>

            <!-- СЕЛЕКТОР СКИНОВ -->
            <div class="text-left space-y-1.5">
                <div class="flex justify-between items-center">
                    <label class="block text-[10px] font-extrabold text-pink-400 uppercase tracking-widest">Выберите Скин Класс</label>
                    <span id="skinNameBadge" class="text-[11px] font-bold text-cyan-300 font-display">Cyber Knight</span>
                </div>
                
                <!-- Список Карт Скинов с Горизонтальным Скроллом -->
                <div id="skinSelectorGrid" class="flex gap-2.5 overflow-x-auto pb-2 pt-1 no-scrollbar pointer-events-auto">
                    <!-- Скины динамически генерируются из JS -->
                </div>
            </div>

            <!-- Блок Совместной Игры / Кода комнаты -->
            <div class="pt-2 border-t border-slate-800/80 text-left space-y-1">
                <label class="block text-[10px] font-extrabold text-teal-400 uppercase tracking-widest">Код Комнаты</label>
                <div class="flex gap-2">
                    <input type="text" id="roomInput" maxlength="6" placeholder="СЛУЧАЙНАЯ" 
                           class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm font-mono uppercase focus:outline-none focus:border-teal-500 text-teal-300 tracking-wider">
                    <button onclick="generateNewRoomCode()" class="px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-slate-300 text-xs font-bold active:scale-95 transition" title="Сгенерировать код">
                        <i class="fa-solid fa-dice"></i>
                    </button>
                </div>
            </div>

            <!-- Главные кнопки подключения -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
                <button onclick="startMatch('create')" class="py-3 bg-gradient-to-r from-pink-500 to-rose-600 hover:brightness-110 text-white font-display font-bold text-xs rounded-xl shadow-lg shadow-pink-500/25 active:scale-95 transition">
                    <i class="fa-solid fa-plus-circle mr-1"></i> СОЗДАТЬ
                </button>
                <button onclick="startMatch('join')" class="py-3 bg-gradient-to-r from-cyan-500 to-teal-500 hover:brightness-110 text-slate-950 font-display font-bold text-xs rounded-xl shadow-lg shadow-cyan-500/25 active:scale-95 transition">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> ВОЙТИ
                </button>
            </div>

            <button onclick="copyInviteLink()" class="w-full py-2 bg-slate-900/80 border border-slate-800 rounded-xl text-slate-400 hover:text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 active:scale-95 transition">
                <i class="fa-solid fa-share-nodes text-cyan-400"></i> Скопировать ссылку другу
            </button>
        </div>
    </div>

    <!-- Игровой Кавас -->
    <canvas id="gameCanvas" class="w-full h-full block"></canvas>

    <!-- Игровой Мобильный HUD -->
    <div id="gameUI" class="hidden absolute inset-0 pointer-events-none p-3 flex flex-col justify-between">
        <!-- Верхняя Панель HUD -->
        <div class="flex justify-between items-start gap-2">
            
            <!-- Статус Игрока -->
            <div class="glass px-3 py-2 rounded-2xl pointer-events-auto flex items-center gap-3 border border-slate-700/60 shadow-lg">
                <div class="space-y-1">
                    <div class="flex justify-between items-center text-[11px] font-bold gap-4">
                        <span id="hudName" class="text-cyan-400 font-display truncate max-w-[80px]">Brawler</span>
                        <span id="hudScore" class="text-amber-400 font-mono">0 XP</span>
                    </div>
                    <!-- Здоровье -->
                    <div class="w-28 h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-700">
                        <div id="healthBar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-150" style="width: 100%;"></div>
                    </div>
                </div>
            </div>

            <!-- Код текущей комнаты с копированием во время боя -->
            <div class="glass px-3 py-1.5 rounded-2xl pointer-events-auto flex items-center gap-2 border border-pink-500/40 shadow-lg">
                <div class="text-right">
                    <div class="text-[9px] font-extrabold text-pink-400 tracking-wider">КОМНАТА</div>
                    <div id="hudRoomCode" class="font-mono text-xs font-black text-slate-100 tracking-widest">---</div>
                </div>
                <button onclick="copyInviteLink()" class="w-7 h-7 rounded-lg bg-pink-500/20 text-pink-300 border border-pink-500/40 flex items-center justify-center active:scale-90 transition">
                    <i class="fa-solid fa-copy text-xs"></i>
                </button>
            </div>

            <!-- Кнопки Чат / Таблица Лидеров -->
            <div class="flex items-center gap-1.5 pointer-events-auto">
                <button onclick="toggleEmojiPicker()" class="glass w-9 h-9 rounded-xl flex items-center justify-center text-amber-400 text-base border border-slate-700/60 active:scale-90 transition">
                    <i class="fa-solid fa-face-smile"></i>
                </button>
                <button onclick="toggleLeaderboard()" class="glass w-9 h-9 rounded-xl flex items-center justify-center text-cyan-400 text-base border border-slate-700/60 active:scale-90 transition">
                    <i class="fa-solid fa-trophy"></i>
                </button>
            </div>
        </div>

        <!-- Выдвижной Лидерборд -->
        <div id="leaderboardDrawer" class="drawer-slide drawer-closed absolute top-16 right-3 z-40 glass w-52 p-3 rounded-2xl border border-slate-700/70 shadow-2xl pointer-events-auto">
            <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-700/50">
                <h3 class="font-display text-[11px] font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-1">
                    <i class="fa-solid fa-crown text-amber-400"></i> Игроки в бою
                </h3>
                <button onclick="toggleLeaderboard()" class="text-slate-400 text-xs px-1"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="leaderboardList" class="space-y-1.5 text-xs"></div>
        </div>

        <!-- Выпадающий веер эмодзи -->
        <div id="emojiPicker" class="hidden absolute top-16 right-12 z-40 glass p-2 rounded-2xl grid grid-cols-4 gap-1 border border-slate-700/70 shadow-2xl pointer-events-auto">
            <button onclick="sendEmoji('🔥')" class="text-lg p-1 hover:scale-125 transition">🔥</button>
            <button onclick="sendEmoji('⚡')" class="text-lg p-1 hover:scale-125 transition">⚡</button>
            <button onclick="sendEmoji('💀')" class="text-lg p-1 hover:scale-125 transition">💀</button>
            <button onclick="sendEmoji('😎')" class="text-lg p-1 hover:scale-125 transition">😎</button>
            <button onclick="sendEmoji('👑')" class="text-lg p-1 hover:scale-125 transition">👑</button>
            <button onclick="sendEmoji('⚔️')" class="text-lg p-1 hover:scale-125 transition">⚔️</button>
            <button onclick="sendEmoji('👻')" class="text-lg p-1 hover:scale-125 transition">👻</button>
            <button onclick="sendEmoji('🎯')" class="text-lg p-1 hover:scale-125 transition">🎯</button>
        </div>

        <!-- Мобильные Кнопки Управления (Джойстик слева, Кнопки действия справа) -->
        <div class="flex justify-between items-end w-full pb-1">
            <!-- ЛЕВАЯ СТОРОНА: Виртуальный Джойстик -->
            <div id="joystickZone" class="pointer-events-auto">
                <div id="joystickStick"></div>
            </div>

            <!-- ПРАВАЯ СТОРОНА: Кнопки Атаки и Рывка -->
            <div class="action-controls-right">
                <!-- Рывок (Dash) -->
                <button id="dashBtn" onclick="doDash()" class="w-14 h-14 rounded-full glass border-2 border-cyan-400/80 text-cyan-300 text-lg flex items-center justify-center shadow-lg shadow-cyan-500/20 active:scale-90 transition relative overflow-hidden">
                    <i class="fa-solid fa-wind"></i>
                    <div id="dashCooldownOverlay" class="absolute inset-0 bg-slate-950/80 h-0 transition-all"></div>
                </button>

                <!-- Кнопка БИТЬ (Attack) -->
                <button id="attackBtn" onclick="doAttack()" class="w-[88px] h-[88px] rounded-full bg-gradient-to-tr from-rose-600 to-pink-500 border-2 border-rose-300 text-white text-3xl flex flex-col items-center justify-center shadow-xl shadow-rose-600/40 active:scale-90 transition transform">
                    <i class="fa-solid fa-hand-fist text-2xl"></i>
                    <span class="text-[9px] font-black tracking-wider uppercase mt-0.5">БИТЬ</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase & Игровая логика -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, onSnapshot, collection, query, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Config
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'neon-brawl-skins';
        
        let customConfigRaw = localStorage.getItem('custom_firebase_config');
        let firebaseConfig = customConfigRaw ? JSON.parse(customConfigRaw) : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoKeyOnlyForPublicFallback",
            authDomain: "demo.firebaseapp.com",
            projectId: "demo-project"
        });

        window.toggleConfigModal = function() {
            const modal = document.getElementById('configModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('firebaseConfigInput').value = JSON.stringify(firebaseConfig, null, 2);
            }
        };

        window.saveCustomFirebaseConfig = function() {
            try {
                const val = document.getElementById('firebaseConfigInput').value.trim();
                const parsed = JSON.parse(val);
                localStorage.setItem('custom_firebase_config', JSON.stringify(parsed));
                showToast("Конфиг сохранен! Перезагрузка...");
                setTimeout(() => window.location.reload(), 1000);
            } catch(e) {
                alert("Ошибка в формате JSON!");
            }
        };

        window.resetFirebaseConfig = function() {
            localStorage.removeItem('custom_firebase_config');
            showToast("Сброшено к умолчанию!");
            setTimeout(() => window.location.reload(), 1000);
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // БАЗА ДАННЫХ 8 УНИКАЛЬНЫХ СКИНОВ / КЛАССОВ
        const SKINS = [
            {
                id: 'cyber_knight',
                name: 'Cyber Knight',
                color: '#38bdf8',
                accentColor: '#0284c7',
                trailColor: 'rgba(56, 189, 248, 0.4)',
                icon: 'fa-shield-halved',
                description: 'Неоновый рыцарь с защитным щитом и двойным клинком',
                auraType: 'shield'
            },
            {
                id: 'shadow_ninja',
                name: 'Shadow Ninja',
                color: '#a855f7',
                accentColor: '#581c87',
                trailColor: 'rgba(168, 85, 247, 0.4)',
                icon: 'fa-user-ninja',
                description: 'Теневой ниндзя с фиолетовой катаной и дымовым шлейфом',
                auraType: 'smoke'
            },
            {
                id: 'fire_demon',
                name: 'Inferno Demon',
                color: '#f43f5e',
                accentColor: '#ea580c',
                trailColor: 'rgba(244, 63, 94, 0.5)',
                icon: 'fa-fire-flame-curved',
                description: 'Адский демон с рогами и огненной аурой пламени',
                auraType: 'fire'
            },
            {
                id: 'mecha_bot',
                name: 'Mecha Bot',
                color: '#eab308',
                accentColor: '#ca8a04',
                trailColor: 'rgba(234, 179, 8, 0.4)',
                icon: 'fa-robot',
                description: 'Тяжелый робот с бронепластинами и лазерным ударом',
                auraType: 'sparks'
            },
            {
                id: 'toxic_mutant',
                name: 'Toxic Mutant',
                color: '#84cc16',
                accentColor: '#4d7c0f',
                trailColor: 'rgba(132, 204, 22, 0.4)',
                icon: 'fa-biohazard',
                description: 'Ядовитый мутант с аурой ядовитой слизи',
                auraType: 'slime'
            },
            {
                id: 'cosmic_void',
                name: 'Cosmic Void',
                color: '#ec4899',
                accentColor: '#06b6d4',
                trailColor: 'rgba(236, 72, 153, 0.4)',
                icon: 'fa-bahai',
                description: 'Космический повелитель с вращающимся кольцом портала',
                auraType: 'void'
            },
            {
                id: 'golden_king',
                name: 'Golden King',
                color: '#f59e0b',
                accentColor: '#fef08a',
                trailColor: 'rgba(245, 158, 11, 0.5)',
                icon: 'fa-crown',
                description: 'Золотой король с короной и королевским плащом',
                auraType: 'holy'
            },
            {
                id: 'ghost_spectre',
                name: 'Ghost Spectre',
                color: '#06b6d4',
                accentColor: '#e0f2fe',
                trailColor: 'rgba(6, 182, 212, 0.3)',
                icon: 'fa-ghost',
                description: 'Полупрозрачный призрак со светящимися глазами',
                auraType: 'spectral'
            }
        ];

        let selectedSkinId = localStorage.getItem('selectedSkinId') || 'cyber_knight';

        // Переменные состояния
        let currentUser = null;
        let roomId = '';
        let myPlayerId = null;
        let playersData = {};
        let gemsData = {};
        let particles = [];
        let floatingEmojis = [];

        // Локальный игрок
        const localPlayer = {
            x: Math.random() * 1200 + 100,
            y: Math.random() * 1200 + 100,
            speed: 4.8,
            radius: 22,
            health: 100,
            score: 0,
            skinId: selectedSkinId,
            isAttacking: false,
            attackAngle: 0,
            attackCooldown: 0,
            dashCooldown: 0,
            name: 'Brawler'
        };

        // Инициализация меню выбора скинов
        function renderSkinSelector() {
            const container = document.getElementById('skinSelectorGrid');
            container.innerHTML = '';

            SKINS.forEach(skin => {
                const isSelected = skin.id === selectedSkinId;
                const card = document.createElement('div');
                card.className = `flex-shrink-0 w-28 p-2.5 rounded-2xl border-2 transition cursor-pointer flex flex-col items-center justify-between space-y-1.5 active:scale-95 ${
                    isSelected ? 'bg-slate-800/90 border-cyan-400 shadow-lg shadow-cyan-500/20' : 'bg-slate-900/60 border-slate-800 opacity-70 hover:opacity-100'
                }`;

                card.onclick = () => {
                    selectedSkinId = skin.id;
                    localPlayer.skinId = skin.id;
                    localStorage.setItem('selectedSkinId', skin.id);
                    document.getElementById('skinNameBadge').textContent = skin.name;
                    document.getElementById('skinNameBadge').style.color = skin.color;
                    renderSkinSelector();
                };

                card.innerHTML = `
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-md" style="background-color: ${skin.color}22; color: ${skin.color}; border: 1px solid ${skin.color}66;">
                        <i class="fa-solid ${skin.icon}"></i>
                    </div>
                    <div class="text-center">
                        <div class="text-[11px] font-bold text-slate-200 truncate w-24">${skin.name}</div>
                        <div class="text-[8px] text-slate-400 font-semibold tracking-tight uppercase mt-0.5">${skin.auraType}</div>
                    </div>
                    ${isSelected ? '<span class="text-[8px] font-black bg-cyan-500 text-slate-950 px-2 py-0.5 rounded-full uppercase tracking-wider">ВЫБРАН</span>' : ''}
                `;

                container.appendChild(card);
            });

            const currentObj = SKINS.find(s => s.id === selectedSkinId) || SKINS[0];
            document.getElementById('skinNameBadge').textContent = currentObj.name;
            document.getElementById('skinNameBadge').style.color = currentObj.color;
        }

        renderSkinSelector();

        // Генерация кода комнаты
        window.generateNewRoomCode = function() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('roomInput').value = code;
        };

        // Загрузка кода из URL (?room=CODE)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('roomInput').value = roomParam.toUpperCase();
                showToast(`Комната из ссылки: ${roomParam.toUpperCase()}`);
            } else {
                generateNewRoomCode();
            }
        });

        window.copyInviteLink = function() {
            const currentCode = roomId || document.getElementById('roomInput').value.trim().toUpperCase() || 'MAIN';
            const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentCode}`;
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(inviteUrl);
            } else {
                const input = document.createElement('input');
                input.value = inviteUrl;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
            }

            showToast(`Ссылка на комнату ${currentCode} скопирована!`);
        };

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = text;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Web Audio API Звуковые эффекты
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playMobileSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (type === 'gem') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'dash') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            }
        }

        // Старт игры
        window.startMatch = async function(mode) {
            const nick = document.getElementById('nicknameInput').value.trim() || 'Brawler';
            let roomCode = document.getElementById('roomInput').value.trim().toUpperCase();

            if (!roomCode) {
                generateNewRoomCode();
                roomCode = document.getElementById('roomInput').value;
            }

            localPlayer.name = nick;
            localPlayer.skinId = selectedSkinId;
            roomId = roomCode;

            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    const userCredential = await signInWithCustomToken(auth, __initial_auth_token);
                    currentUser = userCredential.user;
                } else {
                    const userCredential = await signInAnonymously(auth);
                    currentUser = userCredential.user;
                }
            } catch (err) {
                console.error("Auth Error:", err);
                return;
            }

            myPlayerId = currentUser.uid;
            document.getElementById('hudName').textContent = nick;
            document.getElementById('hudRoomCode').textContent = roomId;

            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('gameUI').classList.remove('hidden');

            initCanvas();
            initJoystick();
            initFirestoreSync();

            requestAnimationFrame(gameLoop);
        };

        // Синхронизация Firestore
        function initFirestoreSync() {
            if (!currentUser) return;

            const playersCol = collection(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_players`);
            const gemsCol = collection(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_gems`);
            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_chat`);

            const myDocRef = doc(playersCol, myPlayerId);
            setDoc(myDocRef, {
                id: myPlayerId,
                name: localPlayer.name,
                skinId: localPlayer.skinId,
                x: localPlayer.x,
                y: localPlayer.y,
                health: localPlayer.health,
                score: localPlayer.score,
                isAttacking: false,
                attackAngle: 0,
                lastSeen: Date.now()
            });

            window.addEventListener('beforeunload', () => deleteDoc(myDocRef));

            // Синхронизация игроков в реальном времени
            onSnapshot(query(playersCol), (snapshot) => {
                const now = Date.now();
                playersData = {};
                snapshot.forEach(docSnap => {
                    const p = docSnap.data();
                    if (now - (p.lastSeen || 0) < 12000) {
                        playersData[p.id] = p;
                        if (p.id === myPlayerId) {
                            localPlayer.health = p.health;
                            document.getElementById('healthBar').style.width = `${Math.max(0, p.health)}%`;
                        }
                    }
                });
                updateLeaderboard();
            }, (err) => console.error(err));

            // Синхронизация кристаллов
            onSnapshot(query(gemsCol), (snapshot) => {
                gemsData = {};
                snapshot.forEach(docSnap => gemsData[docSnap.id] = docSnap.data());
                if (Object.keys(gemsData).length < 20) spawnGems(gemsCol);
            }, (err) => console.error(err));

            // Синхронизация эмодзи
            onSnapshot(query(chatCol), (snapshot) => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        const msg = change.doc.data();
                        if (msg.emoji && msg.x && msg.y) {
                            floatingEmojis.push({ emoji: msg.emoji, x: msg.x, y: msg.y, life: 1.0 });
                        }
                    }
                });
            }, (err) => console.error(err));

            // Heartbeat
            setInterval(() => {
                if (myPlayerId && playersData[myPlayerId]) {
                    updateDoc(myDocRef, {
                        x: localPlayer.x,
                        y: localPlayer.y,
                        health: localPlayer.health,
                        score: localPlayer.score,
                        skinId: localPlayer.skinId,
                        isAttacking: localPlayer.isAttacking,
                        attackAngle: localPlayer.attackAngle,
                        lastSeen: Date.now()
                    });
                }
            }, 100);
        }

        async function spawnGems(gemsCol) {
            for (let i = 0; i < 4; i++) {
                const id = 'gem_' + Math.random().toString(36).substr(2, 8);
                await setDoc(doc(gemsCol, id), {
                    id: id,
                    x: Math.random() * 1300 + 100,
                    y: Math.random() * 1300 + 100,
                    value: Math.floor(Math.random() * 3) + 1
                });
            }
        }

        window.sendEmoji = async function(emojiStr) {
            toggleEmojiPicker();
            if (!currentUser) return;

            const chatCol = collection(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_chat`);
            await addDoc(chatCol, {
                emoji: emojiStr,
                x: localPlayer.x,
                y: localPlayer.y - 35,
                time: Date.now()
            });
        };

        window.toggleLeaderboard = function() {
            document.getElementById('leaderboardDrawer').classList.toggle('drawer-closed');
            document.getElementById('emojiPicker').classList.add('hidden');
        };

        window.toggleEmojiPicker = function() {
            document.getElementById('emojiPicker').classList.toggle('hidden');
            document.getElementById('leaderboardDrawer').classList.add('drawer-closed');
        };

        function updateLeaderboard() {
            const list = document.getElementById('leaderboardList');
            const sorted = Object.values(playersData).sort((a,b) => (b.score || 0) - (a.score || 0)).slice(0, 5);
            list.innerHTML = sorted.map((p, i) => {
                const skinObj = SKINS.find(s => s.id === p.skinId) || SKINS[0];
                return `
                    <div class="flex justify-between items-center text-slate-300">
                        <span class="truncate max-w-[100px] flex items-center gap-1.5 ${p.id === myPlayerId ? 'font-bold text-amber-300' : ''}">
                            <i class="fa-solid ${skinObj.icon} text-[10px]" style="color: ${skinObj.color}"></i>
                            ${p.name}
                        </span>
                        <span class="font-mono text-slate-400 font-bold">${p.score || 0}</span>
                    </div>
                `;
            }).join('');
        }

        // Сенсорный Джойстик
        let joystickVector = { x: 0, y: 0 };
        function initJoystick() {
            const zone = document.getElementById('joystickZone');
            const stick = document.getElementById('joystickStick');
            const maxRadius = 40;

            let touchId = null;
            let startX = 0, startY = 0;

            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                const rect = zone.getBoundingClientRect();
                startX = rect.left + rect.width / 2;
                startY = rect.top + rect.height / 2;
                updateJoystick(touch.clientX, touch.clientY);
            });

            window.addEventListener('touchmove', (e) => {
                if (touchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        break;
                    }
                }
            });

            const endTouch = (e) => {
                if (touchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) {
                        touchId = null;
                        joystickVector = { x: 0, y: 0 };
                        stick.style.transform = `translate(0px, 0px)`;
                        break;
                    }
                }
            };

            window.addEventListener('touchend', endTouch);
            window.addEventListener('touchcancel', endTouch);

            function updateJoystick(clientX, clientY) {
                let dx = clientX - startX;
                let dy = clientY - startY;
                let dist = Math.hypot(dx, dy);

                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }

                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickVector = { x: dx / maxRadius, y: dy / maxRadius };

                if (dist > 5) {
                    localPlayer.attackAngle = Math.atan2(dy, dx);
                }
            }
        }

        // Действие Атаки
        window.doAttack = function() {
            if (localPlayer.attackCooldown > 0) return;
            localPlayer.isAttacking = true;
            localPlayer.attackCooldown = 18;

            playMobileSound('hit');

            const currentSkin = SKINS.find(s => s.id === localPlayer.skinId) || SKINS[0];
            const attackRange = 65;

            Object.values(playersData).forEach(p => {
                if (p.id !== myPlayerId) {
                    const dist = Math.hypot(p.x - localPlayer.x, p.y - localPlayer.y);
                    if (dist < attackRange) {
                        const targetRef = doc(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_players`, p.id);
                        const newHealth = Math.max(0, (p.health || 100) - 25);
                        updateDoc(targetRef, { health: newHealth });
                        
                        createParticles(p.x, p.y, currentSkin.color, 10);
                        localPlayer.score += 15;
                        document.getElementById('hudScore').textContent = `${localPlayer.score} XP`;
                    }
                }
            });

            setTimeout(() => localPlayer.isAttacking = false, 180);
        };

        // Действие Рывка
        window.doDash = function() {
            if (localPlayer.dashCooldown > 0) return;
            
            const dashAngle = (joystickVector.x !== 0 || joystickVector.y !== 0) 
                ? Math.atan2(joystickVector.y, joystickVector.x) 
                : localPlayer.attackAngle;

            const currentSkin = SKINS.find(s => s.id === localPlayer.skinId) || SKINS[0];

            localPlayer.x += Math.cos(dashAngle) * 90;
            localPlayer.y += Math.sin(dashAngle) * 90;
            localPlayer.dashCooldown = 100;

            playMobileSound('dash');
            createParticles(localPlayer.x, localPlayer.y, currentSkin.color, 12);

            const overlay = document.getElementById('dashCooldownOverlay');
            overlay.style.height = '100%';
            let dashTimer = setInterval(() => {
                localPlayer.dashCooldown -= 2;
                overlay.style.height = `${(localPlayer.dashCooldown / 100) * 100}%`;
                if (localPlayer.dashCooldown <= 0) {
                    clearInterval(dashTimer);
                    overlay.style.height = '0%';
                }
            }, 30);
        };

        function createParticles(x, y, color, count = 6) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y, color,
                    vx: (Math.random() - 0.5) * 9,
                    vy: (Math.random() - 0.5) * 9,
                    size: Math.random() * 3 + 2,
                    life: 1.0
                });
            }
        }

        let canvas, ctx;
        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function gameLoop() {
            updateLogic();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        function updateLogic() {
            if (localPlayer.health <= 0) {
                localPlayer.health = 100;
                localPlayer.x = Math.random() * 1200 + 100;
                localPlayer.y = Math.random() * 1200 + 100;
                localPlayer.score = Math.max(0, localPlayer.score - 20);
            }

            localPlayer.x += joystickVector.x * localPlayer.speed;
            localPlayer.y += joystickVector.y * localPlayer.speed;

            localPlayer.x = Math.max(30, Math.min(1470, localPlayer.x));
            localPlayer.y = Math.max(30, Math.min(1470, localPlayer.y));

            if (localPlayer.attackCooldown > 0) localPlayer.attackCooldown--;

            // Спавн следа/ауры для движущегося игрока
            if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                const skinObj = SKINS.find(s => s.id === localPlayer.skinId) || SKINS[0];
                if (Math.random() < 0.4) {
                    createParticles(localPlayer.x, localPlayer.y, skinObj.color, 1);
                }
            }

            // Подбор кристаллов
            Object.values(gemsData).forEach(gem => {
                if (Math.hypot(gem.x - localPlayer.x, gem.y - localPlayer.y) < localPlayer.radius + 12) {
                    deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `rooms_${roomId}_gems`, gem.id));
                    localPlayer.score += gem.value * 5;
                    document.getElementById('hudScore').textContent = `${localPlayer.score} XP`;
                    createParticles(gem.x, gem.y, '#38bdf8', 6);
                    playMobileSound('gem');
                }
            });

            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            });

            floatingEmojis.forEach((fe, i) => {
                fe.y -= 1.2;
                fe.life -= 0.02;
                if (fe.life <= 0) floatingEmojis.splice(i, 1);
            });
        }

        // Отрисовка игрового поля и кастомных скинов
        function renderGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cameraX = canvas.width / 2 - localPlayer.x;
            const cameraY = canvas.height / 2 - localPlayer.y;

            ctx.save();
            ctx.translate(cameraX, cameraY);

            // Неоновая сетка арены
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let x = 0; x <= 1500; x += 100) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1500); ctx.stroke();
            }
            for (let y = 0; y <= 1500; y += 100) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1500, y); ctx.stroke();
            }

            // Внешняя граница
            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 6;
            ctx.strokeRect(0, 0, 1500, 1500);

            // Кристаллы
            Object.values(gemsData).forEach(gem => {
                ctx.save();
                ctx.translate(gem.x, gem.y);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, 0, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Отрисовка Частиц/Аур
            particles.forEach(p => {
                ctx.save();
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Отрисовка Игроков со Скинами
            Object.values(playersData).forEach(p => {
                const skin = SKINS.find(s => s.id === p.skinId) || SKINS[0];
                ctx.save();
                ctx.translate(p.x, p.y);

                // Отрисовка индивидуальной ауры скина
                renderSkinAura(ctx, skin, Date.now() / 1000);

                // Основное тело
                ctx.fillStyle = skin.color;
                ctx.shadowColor = skin.color;
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fill();

                // Головной убор / Аксессуар скина
                renderSkinAccessory(ctx, skin);

                // Вращение оружия / Атаки
                ctx.rotate(p.attackAngle || 0);

                // Оружие
                ctx.fillStyle = skin.accentColor || '#ffffff';
                ctx.fillRect(16, -4, 20, 8);

                // Визуальный эффект индивидуальной атаки
                if (p.isAttacking) {
                    ctx.strokeStyle = skin.color;
                    ctx.lineWidth = 6;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = skin.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, 52, -0.8, 0.8);
                    ctx.stroke();
                }

                ctx.restore();

                // Никнейм
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 12px Inter';
                ctx.textAlign = 'center';
                ctx.fillText(p.name || 'Brawler', p.x, p.y - 36);

                // Здоровье
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(p.x - 20, p.y - 30, 40, 5);
                ctx.fillStyle = '#10b981';
                ctx.fillRect(p.x - 20, p.y - 30, (Math.max(0, p.health || 100) / 100) * 40, 5);
            });

            // Отрисовка Эмодзи
            floatingEmojis.forEach(fe => {
                ctx.save();
                ctx.globalAlpha = fe.life;
                ctx.font = '24px serif';
                ctx.fillText(fe.emoji, fe.x, fe.y);
                ctx.restore();
            });

            ctx.restore();
        }

        // Отрисовка Ауры Скина
        function renderSkinAura(ctx, skin, time) {
            ctx.save();
            if (skin.auraType === 'shield') {
                ctx.strokeStyle = skin.color;
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.beginPath();
                ctx.arc(0, 0, 28 + Math.sin(time * 4) * 2, 0, Math.PI * 2);
                ctx.stroke();
            } else if (skin.auraType === 'fire') {
                ctx.fillStyle = 'rgba(234, 88, 12, 0.25)';
                ctx.beginPath();
                ctx.arc(0, 0, 30 + Math.sin(time * 8) * 3, 0, Math.PI * 2);
                ctx.fill();
            } else if (skin.auraType === 'void') {
                ctx.strokeStyle = skin.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 32, time * 3, time * 3 + Math.PI * 1.2);
                ctx.stroke();
            } else if (skin.auraType === 'holy') {
                ctx.fillStyle = 'rgba(254, 240, 138, 0.2)';
                ctx.beginPath();
                ctx.arc(0, 0, 34, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        // Отрисовка Головных уборов и Аксессуаров Скина
        function renderSkinAccessory(ctx, skin) {
            ctx.save();
            ctx.fillStyle = '#ffffff';

            if (skin.id === 'golden_king') {
                // Корона
                ctx.fillStyle = '#fbbf24';
                ctx.beginPath();
                ctx.moveTo(-10, -22);
                ctx.lineTo(-12, -32);
                ctx.lineTo(-4, -26);
                ctx.lineTo(0, -34);
                ctx.lineTo(4, -26);
                ctx.lineTo(12, -32);
                ctx.lineTo(10, -22);
                ctx.closePath();
                ctx.fill();
            } else if (skin.id === 'fire_demon') {
                // Огненные рога
                ctx.fillStyle = '#ea580c';
                ctx.beginPath();
                ctx.moveTo(-12, -18); ctx.lineTo(-18, -30); ctx.lineTo(-6, -22); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(12, -18); ctx.lineTo(18, -30); ctx.lineTo(6, -22); ctx.fill();
            } else if (skin.id === 'shadow_ninja') {
                // Повязка ниндзя
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(-18, -12, 36, 8);
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(-8, -10, 16, 4);
            } else if (skin.id === 'mecha_bot') {
                // Визор робота
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(-14, -6, 28, 6);
            } else if (skin.id === 'cyber_knight') {
                // Рыцарский рог/забрало
                ctx.fillStyle = '#0284c7';
                ctx.beginPath();
                ctx.arc(0, -18, 6, 0, Math.PI * 2);
                ctx.fill();
            } else if (skin.id === 'ghost_spectre') {
                // Глаза призрака
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(-7, -4, 4, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(7, -4, 4, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }
    </script>
